const W = 1280, H = 720, CELL_W = 8, CELL_H = 16;
const COLS = W / CELL_W, ROWS = H / CELL_H, NC = ROWS * COLS;
const FPS = 30, DURATION = 15.0;
const RAMP = [..." .·:;=+*o#%@█"];
const GLYPHS = [..."0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz?|/\\+*#%@&$!()<>=~^"];

const ATLAS_BITS = {};
for (const k in ATLAS) ATLAS_BITS[k] = ATLAS[k];

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function smooth(a, b, t) {
  const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
  return x * x * (3 - 2 * x);
}
const clip01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

const GX = new Float64Array(NC), GY = new Float64Array(NC);
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c;
    GX[i] = (c + 0.5) * CELL_W - W / 2;
    GY[i] = -((r + 0.5) * CELL_H - H / 2);
  }
}

const rng_stable = mulberry32(7);
const THRESH = new Float64Array(NC), VESSEL = new Float64Array(NC);
const STAR_N = 110;
const STAR_X = new Float64Array(STAR_N), STAR_Y = new Float64Array(STAR_N);
const STAR_PH = new Float64Array(STAR_N), STAR_SP = new Float64Array(STAR_N);
const STAR_BIG = new Uint8Array(STAR_N);
for (let i = 0; i < NC; i++) { THRESH[i] = rng_stable(); VESSEL[i] = rng_stable(); }
for (let i = 0; i < STAR_N; i++) {
  STAR_X[i] = (rng_stable() * 2 - 1) * W * 0.48;
  STAR_Y[i] = (rng_stable() * 2 - 1) * H * 0.48;
  STAR_PH[i] = rng_stable() * Math.PI * 2;
  STAR_SP[i] = 2 + rng_stable() * 3;
  STAR_BIG[i] = rng_stable() < 0.35 ? 1 : 0;

function zoomAt(t) {
  if (t <= 3) return 1;
  if (t <= 9) return 1 + 0.12 * smooth(3, 9, t);
  if (t <= 12.3) return 1.12 * Math.pow(9 / 1.12, smooth(9, 12.3, t));
  return 9;
}
function gaze(t) {
  const w = smooth(2.6, 4.2, t) * (1 - smooth(9.0, 10.4, t));
  return [14 * Math.sin(t * 0.85) * w, 8 * Math.sin(t * 0.55 + 1.2) * w];
}

function renderFrame(t, fi, data) {
  data.fill(0);
  const aS = smooth(0, 1.5, t) * (1 - smooth(11.3, 12.7, t));
  const aI = smooth(1.5, 3.2, t) * (1 - smooth(11.3, 12.7, t));
  const aH = smooth(11.7, 13.9, t);
  const aSt = smooth(8.8, 12.0, t);
  const z = zoomAt(t);
  const [ox, oy] = gaze(t);

  let star = null;
  if (aSt > 0.001) {
    star = new Float64Array(NC);
    for (let i = 0; i < STAR_N; i++) {
      const tw = 0.5 + 0.5 * Math.sin(t * STAR_SP[i] + STAR_PH[i]);
      const col = Math.trunc((STAR_X[i] + W / 2) / CELL_W);
      const row = Math.trunc((H / 2 - STAR_Y[i]) / CELL_H);
      if (row < 0 || row >= ROWS || col < 0 || col >= COLS) continue;
      const b = aSt * (0.45 + 0.55 * tw);
      const idx = row * COLS + col;
      if (b > star[idx]) star[idx] = b;
      if (STAR_BIG[i] && b > 0.45) {
        const nb = b * 0.55;
        for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
          const rr = row + dr, cc = col + dc;
          if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
            const j = rr * COLS + cc;
            if (nb > star[j]) star[j] = nb;
          }

  }

  const rngChar = mulberry32(fi + 4242);
  const bob = Math.sin((t - 11.7) * 2.1) * H * 0.02;
  const flick = 0.75 + 0.25 * Math.sin(t * 7);
  const wipeR = 3.7 * smooth(0, 1.5, t);
  const heartS = H * 0.3 * (0.38 + 0.62 * smooth(11.7, 14.2, t));
  const eyeOn = aS > 0.001 || aI > 0.001;
  const irisN = H * 0.29;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {

        const srcY = oy + (GY[i] - oy) / z;

          lidBot = H * 0.35 * Math.pow(wlid, 0.75);

            const ringK = 1 - 0.75 * limbus;
            const iR = clip01(irisLum * 1.02) * ringK;
            const iG = clip01(irisLum * 0.66 - limbus * 0.22) * ringK;
            const iB = clip01(irisLum * 0.34 - limbus * 0.1) * ringK;
            const addR = (iR + pupilLum * 0.9) * core;
            const addG = (iG + pupilLum * 0.8) * core;
            const addB = (iB + pupilLum * 0.7) * core;
            R = R * (1 - core) + addR;
            G = G * (1 - core) + addG;
            B = B * (1 - core) + addB;
            lum = Math.max(lum, core * charLum);
          }
        } else if (wlid > 0) {
          let rim = 0;
          if (srcY >= lidTop) rim = 0.16 * Math.exp(-(srcY - lidTop) / 7);
          else if (srcY <= -lidBot) rim = 0.16 * Math.exp(-(-lidBot - srcY) / 7);
          const rm = rim * Math.max(aS, aI);
          if (rm > 0.005) { R += rm; G += rm; B += rm; lum = Math.max(lum, rm); }
        } else {
          const speck = rngSpeck(); // keep RNG stream stable across cells
        }
      }

      // ---- heart ----
      if (aH > 0.001) {
        const x = GX[i] / heartS;
        const y = (GY[i] - bob) / heartS;
        const eq = Math.pow(x * x + y * y - 1, 3) - x * x * Math.pow(y, 3);
        const band = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(((GY[i] - bob) / CELL_H) * 1.05 + 0.4));
        const h = clip01(clip01(-eq * 6) * 1.4) * band;
        const keep = THRESH[i] + 0.12 < aH + 0.4 ? 1 : 0;
        const m = clip01(h * aH * keep);
        const hG = 0.28 + 0.2 * (1 - m), hB = 0.55 + 0.25 * (1 - m);
        R = Math.max(R, 1 * m * flick);
        G = Math.max(G, hG * m * flick);
        B = Math.max(B, hB * m * flick);
        lum = Math.max(lum, m * 0.9 * flick);
      }

      // ---- stars (white in dark, dark sparkles on bright) ----
      if (star) {
        const bg = clip01(lum * 2.5);
        const white = star[i] * (1 - bg);
        const dark = star[i] * bg;
        lum = (lum + white * 0.95) * (1 - dark * 0.9);
        R = Math.max(R, white * 0.95) * (1 - dark * 0.9);
        G = Math.max(G, white * 0.96) * (1 - dark * 0.9);
        B = Math.max(B, white * 1.0) * (1 - dark * 0.9);
      }

      // ---- pick character ----
      let ch;
      if (lum <= 0.04) ch = " ";
      else {
        const idx = Math.min(RAMP.length - 1, Math.max(0, (Math.pow(lum, 0.8) * RAMP.length) | 0));
        ch = RAMP[idx];
        const rv = rngChar(), gi = (rngChar() * GLYPHS.length) | 0;
        if (lum > 0.18 && rv < 0.3) ch = GLYPHS[gi];
      }
      if (ch === " ") continue;

      const bits = ATLAS_BITS[ch];
      if (!bits) continue;
      const cr = Math.max(0, Math.min(255, (R * 255) | 0));
      const cg = Math.max(0, Math.min(255, (G * 255) | 0));
      const cb = Math.max(0, Math.min(255, (B * 255) | 0));
      const px = c * CELL_W, py = r * CELL_H;
      for (let y = 0; y < CELL_H; y++) {
        const rowBase = (py + y) * W + px;
        const bo = y * CELL_W;
        for (let x = 0; x < CELL_W; x++) {
          if (bits.charCodeAt(bo + x) !== 49) continue;
          const p = (rowBase + x) * 4;
          data[p] = cr; data[p + 1] = cg; data[p + 2] = cb; data[p + 3] = 255;
        }
      }
    }
  }
}
// ENGINE_END

if (typeof document !== "undefined") {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(W, H);
  const data = img.data;

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
  }
  addEventListener("resize", fit);
  fit();

  canvas.addEventListener("click", () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const fn = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
      if (fn) { const p = fn.call(canvas); if (p && p.catch) p.catch(() => {}); }
    }
  });

  let t0 = null;
  function loop(now) {
    if (t0 === null) t0 = now;
    const t = ((now - t0) / 1000) % DURATION;
    renderFrame(t, Math.floor(t * FPS), data);
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
