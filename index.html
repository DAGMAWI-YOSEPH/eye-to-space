const W = 1280, H = 720, CELL_W = 8, CELL_H = 16;
const COLS = W / CELL_W, ROWS = H / CELL_H, NC = ROWS * COLS;
const FPS = 30, DURATION = 15.0;
const LETTERS = [..."0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"];
const SYMS = [..."?|/\\+*#%@&$!()<>^:;.·-'"];

const ATLAS_BITS = {};
for (const k in ATLAS) ATLAS_BITS[k] = ATLAS[k];

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function smooth(a, b, t) {
  const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
  return x * x * (3 - 2 * x);
}
const clip01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

const GX = new Float64Array(NC), GY = new Float64Array(NC);
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c;
    GX[i] = (c + 0.5) * CELL_W - W / 2;
    GY[i] = -((r + 0.5) * CELL_H - H / 2);
  }
}

const rng_stable = mulberry32(7);
const THRESH = new Float64Array(NC), VESSEL = new Float64Array(NC);
const SPECK = new Float64Array(NC);
for (let i = 0; i < NC; i++) {
  THRESH[i] = rng_stable();
  VESSEL[i] = rng_stable();
  SPECK[i] = rng_stable();
}

const irisN = H * 0.33;
function gazeAmt(t) {
  return smooth(1.9, 2.45, t) * (1 - smooth(3.05, 3.5, t))
       - smooth(3.5, 4.0, t) * (1 - smooth(4.55, 5.15, t));
}
function gazeUp(t) {
  return 0.4 * smooth(2.45, 2.85, t) * (1 - smooth(3.05, 3.5, t))
       - 0.3 * smooth(4.0, 4.35, t) * (1 - smooth(4.55, 5.15, t));
}
function blinkAmt(t) {
  const x = Math.abs(t - 3.28);
  return x < 0.1 ? 1 - x / 0.1 : 0;
}

function renderFrame(t, fi, data) {
  data.fill(0);

  const lid = smooth(0.25, 1.5, te) * (1 - blinkAmt(te));
  const aI = 1;

  const zoom = Math.pow(2, 3.15 * zp);
  const aH = smooth(5.7, 6.6, te);

  const gazePy = gazeUp(te) * irisN * 0.2;

    for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c;
      let R = 0, G = 0, B = 0;
      let lit = false;

      // ---- skin + eye: lids open, gaze, zoom into pupil with heart inside ----

        const EX0 = (GX[i] - gazePx) / zoom;
        const EY0 = (GY[i] - gazePy) / zoom;

        const nx = EX0 / rx;
        const inW = Math.abs(nx) < 1;
        const u = (nx + 1) * 0.5;

            R = 0.12; G = 0.08; B = 0.07; lit = true;

            clip01(Math.sin(VESSEL[i] * 61 + dx * 0.045 + dy * 0.02) * 0.5 + 0.5 - 0.93) * 4 *

          cb *= 1 - vein * 0.12;

            const keep = THRESH[i] < aI * 0.95 + 0.05 ? 1 : 0;
            const m = clip01(aI * 1.15) * keep;
            const pup = clip01((0.5 - r2n) / 0.05) * m;

            const mid = clip01((r2n - 0.485) / 0.05) * clip01((1.03 - r2n) / 0.05) * m;
            const limbus = Math.exp(-Math.pow((r2n - 0.99) / 0.05, 2));
            const coll = Math.exp(-Math.pow((r2n - 0.6) / 0.05, 2));
            const hot = Math.exp(-Math.pow((r2n - 0.9) / 0.05, 2));
            const fw = Math.pow(0.15 + 0.85 * fibers, 1.6);
            const irisLum = mid * (rings * (0.22 + 0.78 * fw) * (1 - 0.8 * limbus) + coll * 0.3 + hot * 0.34);
            let warm = clip01(irisLum * 1.55);
            if (THRESH[i] < 0.13) warm *= 0.35;
            if (warm > 0.001) {
              const oG = 0.5 - 0.12 * warm;
              const oB = 0.08 + 0.06 * (1 - warm);
              cr = cr * (1 - warm) + warm;
              cg = cg * (1 - warm) + oG * warm;
              cb = cb * (1 - warm) + oB * warm;
            }
            const dk = clip01(limbus * 0.85 * mid);
            cr *= 1 - dk; cg *= 1 - dk; cb *= 1 - dk;
            if (pup > 0.001) {
              const fig = Math.exp(-(Math.pow((dx + 4) / (W * 0.014), 2) + Math.pow((dy + H * 0.03) / (H * 0.05), 2)));
              const fig2 = Math.exp(-(Math.pow((dx - 12) / (W * 0.012), 2) + Math.pow((dy + H * 0.07) / (H * 0.038), 2)));
              const glint = Math.exp(-(Math.pow((dx - W * 0.042) / (W * 0.013), 2) + Math.pow((dy - H * 0.055) / (H * 0.028), 2)));
              const glint2 = Math.exp(-(Math.pow((dx + W * 0.05) / (W * 0.02), 2) + Math.pow((dy + H * 0.06) / (H * 0.035), 2)));
              const pupilLum = 0.2 * fig + 0.1 * fig2 + 2.4 * glint + 0.22 * glint2;
              cr = cr * (1 - pup) + (0.085 + pupilLum * 0.9) * pup;
              cg = cg * (1 - pup) + (0.085 + pupilLum * 0.86) * pup;
              cb = cb * (1 - pup) + (0.1 + pupilLum * 0.78) * pup;
            }
          }
          const halo =
            Math.exp(-Math.pow((r2n - 1.05) / 0.95, 2)) *
            clip01((r2n - 0.58) / 0.22) * 0.24;
          cr = Math.min(1, cr + halo * 0.9);
          cg = Math.min(1, cg + halo * 0.5);
          cb = Math.min(1, cb + halo * 0.12);
          if (dx < -rx * 0.87) {
            const cm = clip01((dx + rx) / (rx * 0.13)) * 0.75;
            cr = cr * (1 - cm) + 0.82 * cm;
            cg = cg * (1 - cm) + 0.5 * cm;
            cb = cb * (1 - cm) + 0.52 * cm;
          }
          const lidSh = clip01((EY0 - (yTop - irisN * 0.24)) / (irisN * 0.24)) * 0.45;
          const cornerSh = clip01((Math.abs(dx) / rx - 0.55) / 0.45) * 0.5;
          const dim = (1 - lidSh) * (1 - cornerSh);
          R = cr * dim; G = cg * dim; B = cb * dim; lit = true;
        }
        const fall = 1 - 0.55 * smooth(6.5, 10.5, te);
        R *= fall; G *= fall; B *= fall;
      }

      // ---- heart: full icon heart (overlapping lobes + taper) ----
      if (aH > 0.001) {
        const x = GX[i] / (heartS * 1.18);
        const y = (GY[i] - bob + heartS * 0.2) / heartS;
        const cy0 = 0.5;
        const d1 = Math.hypot(x + 0.4, y - cy0) - 0.62;
        const d2 = Math.hypot(x - 0.4, y - cy0) - 0.62;
        const halfW = 0.98 * (y + 1.18) / 1.6;
        const dT = Math.max(Math.abs(x) - halfW, Math.max(y - 0.42, -y - 1.18));
        const d = Math.min(Math.min(d1, d2), dT);
        const fill = clip01(-d * 14);
        const keep = THRESH[i] < aH * 6 + 0.35 ? 1 : 0;
        const band = 0.94 + 0.06 * Math.sin(y * 3.1 + 0.4);
        const m = fill * clip01(aH * 2.4) * keep * band;
        if (m > 0.01) {
          const sp = SPECK[i];
          const gy01 = clip01((y + 1.18) / 2.3);
          let hR = 0.94 + 0.06 * gy01;
          let hG = 0.1 + 0.42 * Math.pow(gy01, 0.9);
          let hB = 0.15 + 0.45 * Math.pow(gy01, 0.8);
          if (sp < 0.06) { hR = 1; hG += 0.2; hB += 0.25; }
          const spec = Math.exp(-(Math.pow((x + 0.42) / 0.34, 2) + Math.pow((y - 0.78) / 0.22, 2)));
          const v = m * flick * (0.97 + 0.13 * sp + 0.3 * spec);
          R = Math.max(R, hR * v);
          G = Math.max(G, hG * v);
          B = Math.max(B, hB * v);
          lit = true;
        }
      }

      const mx = Math.max(R, Math.max(G, B));
      if (mx <= 0.045) continue;

      // ---- pick character ----
      const q = rngChar();
      const ch = q < 0.8
        ? LETTERS[(rngChar() * LETTERS.length) | 0]
        : SYMS[(rngChar() * SYMS.length) | 0];

      const bits = ATLAS_BITS[ch];
      if (!bits) continue;
      const cr = Math.max(0, Math.min(255, (R * 255) | 0));
      const cg = Math.max(0, Math.min(255, (G * 255) | 0));
      const cb = Math.max(0, Math.min(255, (B * 255) | 0));
      const px = c * CELL_W, py = r * CELL_H;
      for (let y = 0; y < CELL_H; y++) {
        const rowBase = (py + y) * W + px;
        const bo = y * CELL_W;
        for (let x = 0; x < CELL_W; x++) {
          if (bits.charCodeAt(bo + x) !== 49) continue;
          const p = (rowBase + x) * 4;
          data[p] = cr; data[p + 1] = cg; data[p + 2] = cb; data[p + 3] = 255;
        }
      }
    }
  }
}
// ENGINE_END

if (typeof document !== "undefined") {

  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(W, H);

  function fit() {

    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
  }
  addEventListener("resize", fit);
  fit();

  canvas.addEventListener("click", () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const fn = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
      if (fn) { const p = fn.call(canvas); if (p && p.catch) p.catch(() => {}); }
    }
  });

  let t0 = null;
  const bgm = document.getElementById("bgm");
  const BGM_START = 83;
  let audioStarted = false;
  function startAudio() {
    if (!bgm || audioStarted) return;
    if (bgm.readyState >= 1 && (bgm.currentTime < BGM_START - 0.5 || bgm.currentTime > BGM_START + 120)) {
      try { bgm.currentTime = BGM_START; } catch (e) {}
    }
    const p = bgm.play();
    if (p && p.then) {
      p.then(() => {
        audioStarted = true;
        if (t0 !== null && performance.now() - t0 > 4000) t0 = performance.now();
      }).catch(() => {});
    } else audioStarted = true;
  }
  if (bgm) {
    bgm.addEventListener("loadedmetadata", () => {
      try { bgm.currentTime = BGM_START; } catch (e) {}
      startAudio();
    });
    addEventListener("pointerdown", startAudio);
    addEventListener("keydown", startAudio);
    startAudio();
  }

  function loop(now) {
    if (t0 === null) t0 = now;
    const t = ((now - t0) / 1000) % DURATION;
    renderFrame(t, Math.floor(t * FPS), data);
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

</script>
</body>
