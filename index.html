  const bow = lid < 0.2 ? (1 - lid / 0.2) * irisN * 0.10 * (inW ? Math.sin(Math.PI * u) : 0) : 0;
  const yTop = irisN * 0.86 * lid * Math.pow(Math.max(sT, 0), 0.75) + tilt + bow;
  const yBot = -irisN * 1.08 * lid * Math.pow(Math.max(sB, 0), 1.35) + tilt + bow;
  const inAp = inW && EY0 < yTop && EY0 > yBot;
  let R, G, B;

  if (!inAp) {
    const dT = EY0 - yTop, dB = yBot - EY0;
    const lashWT = irisN * 0.1, lashWB = irisN * 0.04;
    let lashHit = 0;
    if (inW && lid > 0.3) {
      if (dT >= lashWT && dT < lashWT + irisN * 0.26) {
        const outT = dT - lashWT;
        const hair = 0.5 + 0.5 * Math.sin(EX0 * 0.09 + VESSEL[i] * 3);
        if (THRESH[i] < 0.3 * (1 - outT / (irisN * 0.26)) * (0.35 + 0.85 * hair)) lashHit = 1;
      }
      if (dB >= lashWB && dB < lashWB + irisN * 0.18) {
        const outB = dB - lashWB;
        const hair = 0.5 + 0.5 * Math.sin(EX0 * 0.15 + VESSEL[i] * 4);
        if (THRESH[i] < 0.2 * (1 - outB / (irisN * 0.18)) * (0.3 + 0.9 * hair)) lashHit = 1;
      }
    }
    let crinkle = 0;
    if (smile > 0.25 && Math.abs(nx) > 0.82 && Math.abs(nx) < 1.15) {
      const ck = Math.sin((EY0 - irisN * 0.1 * Math.sign(nx)) * 0.12 + Math.abs(nx) * 8);
      if (ck > 0.55 && THRESH[i] < 0.3 * smile) crinkle = 1;
    }
    if (inW && ((dT >= 0 && dT < lashWT) || (dB >= 0 && dB < lashWB))) {
      // lash seam: textured dark band, not a flat bar
      const th2 = THRESH[i] * THRESH[i];
      const lashJ = 0.5 + 0.5 * Math.sin(EX0 * 0.16 + VESSEL[i] * 7);
      R = 0.06 + 0.07 * th2 + 0.03 * lashJ;
      G = 0.045 + 0.05 * th2 + 0.02 * lashJ;
      B = 0.045 + 0.04 * th2 + 0.02 * lashJ;
    } else if (lashHit) {
      R = 0.09; G = 0.06; B = 0.055;
    } else if (crinkle) {
      R = 0.36; G = 0.22; B = 0.18;
    } else if (inW && lid > 0.25 && dT >= irisN * (0.45 - 0.08 * smile) && dT < irisN * (0.55 - 0.06 * smile)) {
      R = 0.40; G = 0.25; B = 0.20;
    } else {
      // near-eye features only; plain skin → null (caller draws global face skin)
      const pore = 0.86 + 0.14 * SPECK[i];
      const blot = Math.sin(EX0 * 0.0055 + 2.1) * Math.sin(EY0 * 0.0048 - 1.2) +
        0.5 * Math.sin((EX0 + EY0) * 0.0032);
      const rosy = 0.5 + 0.5 * clip01(blot * 0.7 + 0.3);
      const light = 1 + 0.13 * (-EX0 / 640 + EY0 / 360);
      let sR = 0.78 * pore * light;
      let sG = (0.54 - 0.05 * rosy) * pore * light * 0.98;
      let sB = (0.40 - 0.06 * rosy) * pore * light * 0.95;
      if (THRESH[i] < 0.04) { sR *= 0.7; sG *= 0.56; sB *= 0.48; }
      else if (THRESH[i] < 0.06) { sR = Math.min(1, sR * 1.06); sG *= 0.93; sB *= 0.9; }
      // nearly shut: lid bulge shading above the seam, soft shadow below, fold crease
      if (lid < 0.5 && inW) {
        const shut = 1 - lid / 0.5;
        const strand = 0.70 + 0.30 * Math.sin(EX0 * 0.07 + VESSEL[i] * 5);
        const shT = dT >= 0 ? Math.pow(clip01(1 - dT / (irisN * 0.9)), 1.25) : 0;
        const shB = dB >= 0 ? Math.pow(clip01(1 - dB / (irisN * 0.55)), 1.4) : 0;
        const dimS = (1 - shut * 0.30 * shT * strand) * (1 - shut * 0.18 * shB);
        sR *= dimS; sG *= dimS; sB *= dimS;
        const crease = clip01(1 - Math.abs(dT - irisN * 0.55) / (irisN * 0.10));
        const cm = shut * crease * 0.16;
        sR *= 1 - cm; sG *= 1 - cm; sB *= 1 - cm;
      }
      let cheek = 0;
      if (smile > 0.01) {
        cheek = clip01(1 - Math.abs(EY0 + irisN * 1.15) / (irisN * 0.75))
          * clip01(1 - Math.abs(EX0) / (rx * 1.3)) * smile * 0.2;
        sR = Math.min(1, sR + cheek * 0.9);
        sG = Math.min(1, sG + cheek * 0.45);
        sB = Math.min(1, sB + cheek * 0.35);
      }
      const browD = clip01(1 - Math.pow(EX0 / (irisN * 1.9), 2));
      const browY = clip01(1 - Math.abs(EY0 - irisN * (1.45 + browLift - 0.06 * smile - 0.04 * love)) / (irisN * 0.24));
      const browDens = browD * browY;
      if (browDens > 0.03) {
        const hair = 0.5 + 0.5 * Math.sin(EY0 * 0.45 + EX0 * 0.02 + VESSEL[i] * 2);
        if (THRESH[i] < browDens * (0.3 + 0.6 * hair)) {
          sR = 0.17 * pore; sG = 0.11 * pore; sB = 0.08 * pore;
        } else if (THRESH[i] < browDens + 0.18) {
          sR *= 0.86; sG *= 0.8; sB *= 0.78;
        }
      }
      let socket = 0;
      if (inW) {
        const dOut = Math.min(Math.abs(EY0 - yTop), Math.abs(EY0 - yBot));
        socket = clip01(1 - dOut / (irisN * 0.6)) * 0.38;
        sR *= 1 - socket; sG *= 1 - socket * 1.15; sB *= 1 - socket * 1.25;
      }
      if (browDens < 0.02 && cheek < 0.01 && socket < 0.01) return null;
      R = Math.min(1, sR); G = Math.min(1, sG); B = Math.min(1, sB);
    }
  } else {
    // sclera: white during the opening solo eye, near-black once the face is
    // sclera — stays white at every zoom
    const sl = 0.88 + 0.12 * SPECK[i];
    let cr = Math.min(1, sl), cg = Math.min(1, sl * 0.97), cb = Math.min(1, sl * 0.94);
    const dx = EX0, dy = EY0;
    const r2n = Math.hypot(dx, dy) / irisN;
    const vein =
      clip01(Math.sin(VESSEL[i] * 61 + dx * 0.045 + dy * 0.02) * 0.5 + 0.5 - 0.93) * 4 *
      clip01((Math.abs(dx) / rx - 0.35) / 0.5);
    cr = Math.min(1, cr + vein * 0.28);
    cg *= 1 - vein * 0.15;
    cb *= 1 - vein * 0.12;
    const aI = 1;
    const keep = THRESH[i] < aI * 0.95 + 0.05 ? 1 : 0;
    const m = clip01(aI * 1.15) * keep;
    const pup = clip01((0.5 - r2n) / 0.05) * m;
    const ANGd = Math.atan2(dy, dx);
    const fibers =
      0.5 + 0.5 * Math.sin(ANGd * 48 + 3.1 * Math.sin(ANGd * 13 + 1.7) + r2n * 9 + 0.7 * Math.sin(ANGd * 29));
    const rings = 0.86 + 0.14 * Math.sin(r2n * 34 + ANGd * 2);
    const mid = clip01((r2n - 0.485) / 0.05) * clip01((1.03 - r2n) / 0.05) * m;
    const limbus = Math.exp(-Math.pow((r2n - 0.99) / 0.05, 2));
    const coll = Math.exp(-Math.pow((r2n - 0.6) / 0.05, 2));
    const hot = Math.exp(-Math.pow((r2n - 0.9) / 0.05, 2));
    const fw = Math.pow(0.15 + 0.85 * fibers, 1.6);
    const irisLum = mid * (rings * (0.22 + 0.78 * fw) * (1 - 0.8 * limbus) + coll * 0.3 + hot * 0.34);
    let warm = clip01(irisLum * 1.55);
    if (THRESH[i] < 0.13) warm *= 0.35;
    if (warm > 0.001) {
      const oG = 0.46 - 0.1 * warm;
      const oB = 0.06 + 0.05 * (1 - warm);
      cr = cr * (1 - warm) + warm;
      cg = cg * (1 - warm) + oG * warm;
      cb = cb * (1 - warm) + oB * warm;
    }
    const dk = clip01(limbus * 0.85 * mid);
    cr *= 1 - dk; cg *= 1 - dk; cb *= 1 - dk;
    if (pup > 0.001) {
      const fig = Math.exp(-(Math.pow((dx + 4) / (W * 0.014), 2) + Math.pow((dy + H * 0.03) / (H * 0.05), 2)));
      const fig2 = Math.exp(-(Math.pow((dx - 12) / (W * 0.012), 2) + Math.pow((dy + H * 0.07) / (H * 0.038), 2)));
      const glint = Math.exp(-(Math.pow((dx - W * 0.042) / (W * 0.013), 2) + Math.pow((dy - H * 0.055) / (H * 0.028), 2)));
      const glint2 = Math.exp(-(Math.pow((dx + W * 0.05) / (W * 0.02), 2) + Math.pow((dy + H * 0.06) / (H * 0.035), 2)));
      let pupilLum = 0.16 * fig + 0.08 * fig2 + 2.4 * glint + 0.2 * glint2;
      if (love > 0.01 && isHero) {
        const hs = irisN * 0.17;
        const hx = (dx - irisN * 0.12) / (hs * 1.18);
        const hy = (dy - irisN * 0.16 + hs * 0.2) / hs;
        const hd1 = Math.hypot(hx + 0.4, hy - 0.5) - 0.62;
        const hd2 = Math.hypot(hx - 0.4, hy - 0.5) - 0.62;
        const hHalf = 0.98 * (hy + 1.18) / 1.6;
        const hdT = Math.max(Math.abs(hx) - hHalf, Math.max(hy - 0.42, -hy - 1.18));
        const hd = Math.min(Math.min(hd1, hd2), hdT);
        pupilLum += clip01(-hd * 6) * love * 0.85;
      }
      cr = cr * (1 - pup) + (0.07 + pupilLum * 0.9) * pup;
      cg = cg * (1 - pup) + (0.07 + pupilLum * 0.84) * pup;
      cb = cb * (1 - pup) + (0.085 + pupilLum * 0.76) * pup;
    }
    const halo =
      Math.exp(-Math.pow((r2n - 1.05) / 0.95, 2)) *
      clip01((r2n - 0.58) / 0.22) * 0.24;
    cr = Math.min(1, cr + halo * 0.9);
    cg = Math.min(1, cg + halo * 0.5);
    cb = Math.min(1, cb + halo * 0.12);
    if (dx < -rx * 0.87) {
      const cm = clip01((dx + rx) / (rx * 0.13)) * 0.75;
      cr = cr * (1 - cm) + 0.72 * cm;
      cg = cg * (1 - cm) + 0.42 * cm;
      cb = cb * (1 - cm) + 0.40 * cm;
    }
    const lidSh = clip01((EY0 - (yTop - irisN * 0.24)) / (irisN * 0.24)) * 0.45;
    const cornerSh = clip01((Math.abs(dx) / rx - 0.55) / 0.45) * 0.5;
    const dim = (1 - lidSh) * (1 - cornerSh);
    R = cr * dim; G = cg * dim; B = cb * dim;
  }
  return [R, G, B];
}

function eyeScene(i, t) {
  const te = Math.min(t, DIVE_B);
  const smile = smileAmt(te);
  const wink = winkAmt(te);
  const love = loveAmt(te);
  let lidBase = smooth(1.75, 3.25, te) * (1 - blinkAmt(te));
  // the FOLLOWED (hero) eye stays open through the wink for contrast; the other winks
  const lidHero = Math.min(1.05, lidBase * (1 - 0.14 * smile - 0.1 * love) * (1 + 0.07 * wink));
  const lidOther = lidBase * (1 - wink) * (1 - 0.3 * smile) * (1 - 0.06 * love);
  const [camX, camZ0] = camAt(te);
  const zp = diveAmt(te);
  const zEff = camZ0 * Math.pow(2, 3.6 * zp);
  const wide = smooth(0.78, 0.40, camZ0);   // 0 close-up → 1 both-view

  // head roll + shift during the wink (all features move together)
  const [hTx, hTy, hTh] = headAt(te);
  const hc = Math.cos(hTh), hs = Math.sin(hTh);
  const fcxW = -SEPx;                       // face center between the eyes

  // gaze only in single-eye view; both-eye looks at camera
  const gzFade = clip01((camZ0 - 0.34) / 0.66);
  const gazeL = gazeAmt(te) * gzFade;
  const gazeU = (gazeUp(te) + 0.04 * Math.sin(te * 0.9) * love) * gzFade;
  const gazePx = -gazeL * irisN * 0.34;
  const gazePy = gazeU * irisN * 0.2;
  const gxw = gazePx / zEff, gyw = gazePy / zEff;

  // world coords of this cell (camera applied)
  const wx = GX[i] / zEff + camX;
  const wy = GY[i] / zEff;
  // inverse head transform → pattern space (skin/nose/hairline ride the head)
  const hix = wx - fcxW - hTx, hiy = wy - hTy;
  const pwx = fcxW + hc * hix + hs * hiy;
  const pwy = -hs * hix + hc * hiy;
  // eye centers, forward-transformed by the head move
  const hrx = hc * SEPx + fcxW + hTx;
  const hry = hs * SEPx + hTy;
  const orx = -hc * SEPx + fcxW + hTx;
  const ory = -hs * SEPx + hTy;
  const EXh = wx - hrx - gxw;
  const EYh = wy - hry - gyw;
  const EXo = wx - orx - gxw;
  const EYo = wy - ory - gyw;

  const rx = irisN * 2.65;
  let R = 0, G = 0, B = 0, lit = false;

  let hr = null;
  if (Math.abs(EXh) < rx * 1.7 && Math.abs(EYh) < irisN * 2.4) {
    hr = eyeShader(EXh, EYh, i, lidHero, smile, love, 0.09 * wink, true);
  }
  if (!hr && Math.abs(EXo) < rx * 1.7 && Math.abs(EYo) < irisN * 2.4) {
    hr = eyeShader(EXo, EYo, i, lidOther, smile, love * 0.5, 0, false);
  }
  if (hr) { R = hr[0]; G = hr[1]; B = hr[2]; lit = true; }

  if (!lit) {
    // face skin — always present
    const pore = 0.86 + 0.14 * SPECK[i];
    const blot = Math.sin(pwx * 0.004 + 2.1) * Math.sin(pwy * 0.0035 - 1.2) +
      0.5 * Math.sin((pwx + pwy) * 0.0025);
    const rosy = 0.5 + 0.5 * clip01(blot * 0.7 + 0.3);
    const light = 1 + 0.1 * (-pwx / 900 + pwy / 600);
    let sR = 0.78 * pore * light;
    let sG = (0.54 - 0.05 * rosy) * pore * light * 0.98;
    let sB = (0.40 - 0.06 * rosy) * pore * light * 0.95;
    if (THRESH[i] < 0.04) { sR *= 0.7; sG *= 0.56; sB *= 0.48; }
    // nose — soft broad shading only: one wide side shadow, no bright center
    // line; it fades in just above the brows and out before the nostrils
    if (wide > 0.01) {
      const fcx = fcxW;
      const drop = -pwy / irisN;                // >0 below the eye line
      const span = smooth(-1.6, -1.0, drop) * (1 - smooth(1.55, 2.65, drop));
      const nxr = (pwx - fcx) / irisN;
      const sig = 0.30 + 0.14 * clip01(drop / 2.4);   // broad ridge, widens down
      const nsh = Math.exp(-Math.pow((nxr + 0.75 * sig) / (1.6 * sig), 2));
      const nb = Math.exp(-Math.pow((pwx + SEPx) / (SEPx * 0.45), 2));
      const m = wide * span;
      sR *= 1 - m * (0.05 * nb + 0.09 * nsh);
      sG *= 1 - m * (0.055 * nb + 0.095 * nsh);
      sB *= 1 - m * (0.06 * nb + 0.105 * nsh);
      // sides darker while zoomed out: the empty cheek/temple areas fall into
      // shadow at the frame edges (skin only — applied before hair, never eyes)
      const ax = Math.abs(pwx - fcx);
      const sil = clip01((ax - irisN * 6.3) / (irisN * 1.1));
      const sm = wide * sil * 0.95;
      sR *= 1 - sm; sG *= 1 - sm * 0.98; sB *= 1 - sm * 0.96;
      // hair: solid hairline at top + triangular bang strands hanging below it
      const hd = pwy / irisN;
      let hair = smooth(2.5, 3.15, hd) * wide;
      if (hair < 1) {
        const nx = (pwx - fcx) / irisN;
        for (let bi = 0; bi < BANGS.length; bi++) {
          const B = BANGS[bi];
          const hw = B.hw0 * clip01((hd - B.dp) / (2.9 - B.dp));
          if (hw <= 0) continue;
          const dnx = Math.abs(nx - B.cx);
          if (dnx < hw) {
            hair = Math.max(hair, smooth(hw, hw * 0.3, dnx) * wide);
          }
        }
      }
      if (hair > 0.01) {
        const hairR = 0.13 * pore, hairG = 0.08 * pore, hairB = 0.06 * pore;
        sR = sR * (1 - hair) + hairR * hair;
        sG = sG * (1 - hair) + hairG * hair;
        sB = sB * (1 - hair) + hairB * hair;
      }
    }
    R = Math.min(1, sR); G = Math.min(1, sG); B = Math.min(1, sB);
    lit = true;
  }

  const fall = 1 - 0.55 * smooth(17.5, 21.5, te);
  // zoomed out the face is only the eyebrow → start-of-nose band; above the
  // brows and below the nose start is empty black (soft edges)
  let band = 1;
  if (wide > 0.001) {
    const hbd = pwy / irisN;
    const gLo = smooth(-2.05, -1.5, hbd);
    const gHi = 1 - smooth(1.95, 2.5, hbd);
    band = 1 - wide * (1 - Math.min(gLo, gHi));
  }
  return [R * fall * band, G * fall * band, B * fall * band];
}

function heartOverlay(i, t, te) {
  const zp = diveAmt(te);
  // forms only once the dive is under way — on the pupil, never on the wide face
  const aH = smooth(16.9, 17.9, te);
  if (aH <= 0.001) return null;
  const grow = Math.max(0.12, zp);
  const heartS = 9.7 * Math.pow(2, 5.3 * grow);
  const bob = Math.sin(te * 1.7) * Math.min(H * 0.02, heartS * 0.07);
  const flick = 0.92 + 0.08 * Math.sin(te * 5.5);
  const x = GX[i] / (heartS * 1.18);
  const y = (GY[i] - bob + heartS * 0.2) / heartS;
  const cy0 = 0.5;
  const d1 = Math.hypot(x + 0.4, y - cy0) - 0.62;
  const d2 = Math.hypot(x - 0.4, y - cy0) - 0.62;
  const halfW = 0.98 * (y + 1.18) / 1.6;
  const dT = Math.max(Math.abs(x) - halfW, Math.max(y - 0.42, -y - 1.18));
  const d = Math.min(Math.min(d1, d2), dT);
  const fill = clip01(-d * 14);
  const boom = 1 - smooth(EXPLODE_T, EXPLODE_T + 1.1, t);
  const keep = THRESH[i] < aH * 6 + 0.35 ? 1 : 0;
  const band = 0.94 + 0.06 * Math.sin(y * 3.1 + 0.4);
  const m = fill * clip01(aH * 2.4) * keep * band * boom;
  if (m <= 0.01) return null;
  const sp = SPECK[i];
  const gy01 = clip01((y + 1.18) / 2.3);
  let hR = 0.94 + 0.06 * gy01;
  let hG = 0.1 + 0.42 * Math.pow(gy01, 0.9);
  let hB = 0.15 + 0.45 * Math.pow(gy01, 0.8);
  if (sp < 0.06) { hR = 1; hG += 0.2; hB += 0.25; }
  const spec = Math.exp(-(Math.pow((x + 0.42) / 0.34, 2) + Math.pow((y - 0.78) / 0.22, 2)));
  const fwDim = 1 - 0.5 * smooth(17.6, 18.6, t);
  const v = m * flick * (0.97 + 0.13 * sp + 0.3 * spec) * fwDim;
  return [hR * v, hG * v, hB * v];
}

// ══ fireworks (shared: eye-film phase + early media phase) ══
function drawFireworks(t, data) {
  if (t < 17.5 || t >= 26.8) return;
  const rngF = mulberry32(Math.floor(t * FPS) + 9001);
  for (const burst of FW) {
    const age = t - burst.t0;
    if (age < 0 || age > 1.9) continue;
    const fade = Math.pow(1 - age / 1.9, 1.5);
    for (const p of burst.parts) {
      const x = burst.cx + Math.cos(p.a) * p.sp * age * 420;
      const y = burst.cy + Math.sin(p.a) * p.sp * age * 420 + age * age * 90;
      const b = fade * (0.7 + 0.3 * p.sz);
      if (b < 0.04) continue;
      const cc = (x / CELL_W) | 0, rr = (y / CELL_H) | 0;
      if (cc < 0 || cc >= COLS || rr < 0 || rr >= ROWS) continue;
      const flick = rngF() < 0.85 ? 1 : 0.5;
      const bright = b * flick;
      const [cr, cg, cb] = burst.col;
      const ch = RAMP[(RAMP.length - 1 - ((rngF() * 6) | 0))];
      const bits = ATLAS[ch];
      if (bits) drawCellBits(data, cc, rr, cr * bright, cg * bright, cb * bright, bits);
      if (p.trail && age > 0.12) {
        const tx = (x - Math.cos(p.a) * p.sp * 40) / CELL_W | 0;
        const ty = (y - Math.sin(p.a) * p.sp * 40) / CELL_H | 0;
        if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS) {
          const bits2 = ATLAS[RAMP[(RAMP.length - 1 - ((rngF() * 4) | 0))]];
          if (bits2) drawCellBits(data, tx, ty, cr * bright * 0.4, cg * bright * 0.4, cb * bright * 0.4, bits2);
        }
      }
    }
  }
}

// ══ MAIN RENDER ══
function renderFrame(t, fi, data) {
  data.fill(0);
  if (t >= MEDIA_START) {
    renderMedia(t, data);
    return;
  }
  const te = Math.min(t, DIVE_B);
  const rngChar = mulberry32(Math.floor(te * FPS) + 4242);
  const wipeProg = smooth(0.15, WIPE_END, t);
  const frontierY = wipeProg * H;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c;
      const cellY = r * CELL_H;
      if (wipeProg < 1 && cellY > frontierY) continue;

      const [er, eg, eb] = eyeScene(i, t);
      let R = er, G = eg, B = eb;
      const ho = heartOverlay(i, t, te);
      if (ho) {
        R = Math.max(R, ho[0]); G = Math.max(G, ho[1]); B = Math.max(B, ho[2]);
      }
      const mx = Math.max(R, Math.max(G, B));
      if (mx <= 0.045) continue;
      // luminance-structured glyph: local density tracks local brightness
      // (random glyphs confetti'd the eye shapes — this keeps edges readable)
      const j = (rngChar() - 0.5) * 12;
      let ix = Math.round(mx * (RAMP.length - 1) + j);
      if (ix < 0) ix = 0; else if (ix >= RAMP.length) ix = RAMP.length - 1;
      const bits = RAMP_BITS[ix];
      if (!bits) continue;
      drawCellBits(data, c, r, R * 255, G * 255, B * 255, bits);
    }
  }

  if (wipeProg > 0 && wipeProg < 1) {
    const gy = Math.floor(frontierY / CELL_H);
    for (let c = 0; c < COLS; c++) {
      const bits = RAMP_BITS[18 + (c % 7)];
      if (bits) drawCellBits(data, c, gy, 217, 158, 122, bits);
    }
  }

  drawFireworks(t, data);
  drawLyrics(t, data);
}

// ══ MEDIA (full-frame solos + videos) ══
function segColor(seg, u, c, r) {
  const p = clip01(u / seg.dur);
  const ez = p * p * (3 - 2 * p);
  if (seg.kind === "video") {
    const clip = VC[seg.clip];
    const total = clip.frames.length / clip.fps * clip.loop;
    const lt = Math.min(total - 1e-3, u % total);
    const fi2 = Math.min(clip.frames.length - 1, (lt * clip.fps) | 0);
    const fg = clip.frames[fi2];
    const z = KB_VIDEO.z0 + (KB_VIDEO.z1 - KB_VIDEO.z0) * (lt / total);
    return mediaColor(fg, z, kbPan(clip.fx, z), kbPan(clip.fy, z), c, r);
  }
  const pg = PG[seg.id];
  const kb = KB_SOLO[seg.id % KB_SOLO.length];
  const px = kbPan(pg.fx, kb.z);
  return mediaColor(pg.fg, kb.z,
    px + kbDrift(kb.dir, ez, px, kb.z), kbPan(pg.fy, kb.z), c, r);
}

function blobFromRGB(R, G, B) {
  const lum = (R * 0.299 + G * 0.587 + B * 0.114) / 255;
  if (lum < 0.06) return null; // deep black stays black (decision from v28)
  const lumS = Math.min(0.999, Math.max(0, (lum - 0.04) / 0.82));
  const bits = PBLOB_BITS[(lumS * PBLOB_BITS.length) | 0];
  const atten = 0.74 + 0.26 * lumS;
  return bits ? [R * atten, G * atten, B * atten, bits] : null;
}

function fillCell(data, c, r, R, G, B) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  const cr = R < 0 ? 0 : R > 255 ? 255 : R | 0;
  const cg = G < 0 ? 0 : G > 255 ? 255 : G | 0;
  const cb = B < 0 ? 0 : B > 255 ? 255 : B | 0;
  const cx = c * CELL_W, cy = r * CELL_H;
  for (let y = 0; y < CELL_H; y++) {
    const rowBase = (cy + y) * W + cx;
    for (let x = 0; x < CELL_W; x++) {
      const p = (rowBase + x) * 4;
      data[p] = cr; data[p + 1] = cg; data[p + 2] = cb; data[p + 3] = 255;
    }
  }
}

function drawConfetti(t, data) {
  const age0 = t - EXPLODE_T;
  if (age0 < 0 || age0 > 6.4) return;
  const rnd = mulberry32((t * FPS) | 0);
  for (const p of CONF) {
    const age = age0 - p.d;
    if (age < 0 || age > p.life) continue;
    const disp = p.sp * (1 - Math.exp(-2.2 * age)) / 2.2;
    const x = p.x0 + Math.cos(p.ang) * disp + Math.sin(age * p.fl + p.ph) * 20;
    const y = p.y0 + Math.sin(p.ang) * disp * 0.72 + 190 * age * age
      + Math.cos(age * p.fl * 0.8 + p.ph) * 8;
    if (y > H + CELL_H || x < -CELL_W || x > W + CELL_W) continue;
    const aIn = Math.min(1, age / 0.12);
    const aOut = 1 - smooth(p.life - 1.1, p.life, age);
    const a = aIn * aOut;
    if (a < 0.05) continue;
    const cc = (x / CELL_W) | 0, rr = (y / CELL_H) | 0;
    const br = 0.78 + 0.22 * (rnd() < 0.5 ? 1 : 0.75);
    const [c0, g0, b0] = p.col;
    for (let dy = 0; dy < p.hc; dy++) {
      for (let dx = 0; dx < p.wc; dx++) {
        fillCell(data, cc + dx, rr + dy, c0 * a * br, g0 * a * br, b0 * a * br);
      }
    }
  }
}

function drawFlash(t, data) {
  const f = 1 - smooth(EXPLODE_T, EXPLODE_T + 0.55, t);
  if (f <= 0.01) return;
  for (let y = 0; y < H; y++) {
    const dy = (y - H * 0.46) / (H * 0.72);
    for (let x = 0; x < W; x++) {
      const dx = (x - W / 2) / (W * 0.62);
      const d = Math.sqrt(dx * dx + dy * dy);
      const v = f * clip01(1.15 - d);
      if (v < 0.02) continue;
      const warm = clip01(1 - d);
      const tr = 255, tg = 110 + 130 * warm, tb = 140 + 100 * warm;
      const p = (y * W + x) * 4;
      if (!data[p + 3]) {
        data[p] = tr * v; data[p + 1] = tg * v; data[p + 2] = tb * v;
        data[p + 3] = 255;
      } else {
        data[p] += (tr - data[p]) * v;
        data[p + 1] += (tg - data[p + 1]) * v;
        data[p + 2] += (tb - data[p + 2]) * v;
      }
    }
  }
}

// realistic blink over the frame — upper lid arcs down, lower lid rises to
// meet it, lash-dark edge travels with the lid, crease line when shut
function drawLid(c, data) {
  if (c <= 0.004) return;
  const yM = H * 0.54;
  const pU = c;
  const pL = clip01((c - 0.12) / 0.88);   // lower lid lags, travels less
  const sigU = H * H * 0.00045, sigL = H * H * 0.0005;
  for (let x = 0; x < W; x++) {
    const nx = (x / W - 0.5) * 2;                 // -1 … 1
    const cu = Math.cos(nx * Math.PI * 0.5);       // 1 center → 0 corners
    const yU = yM - (1 - pU) * (yM + H * 0.10) * (0.86 + 0.14 * cu);
    const yL = yM + (1 - pL) * (H - yM + H * 0.10) * (0.90 + 0.10 * cu);
    const iU = Math.min(H, Math.max(0, Math.ceil(yU)));
    const iL = Math.min(H, Math.max(0, Math.floor(yL)));
    for (let y = 0; y < iU; y++) {
      const d = yU - y;
      const s = Math.min(1, d / (H * 0.42));
      const lash = 1 - 0.72 * Math.exp(-(d * d) / sigU);
      const p = (y * W + x) * 4;
      data[p] = (14 + 54 * s) * lash;
      data[p + 1] = (8 + 30 * s) * lash;
      data[p + 2] = (7 + 22 * s) * lash;
      data[p + 3] = 255;
    }
    for (let y = iL; y < H; y++) {
      const d = y - yL;
      const s = Math.min(1, d / (H * 0.36));
      const lash = 1 - 0.62 * Math.exp(-(d * d) / sigL);
      const p = (y * W + x) * 4;
      data[p] = (19 + 58 * s) * lash;
      data[p + 1] = (11 + 34 * s) * lash;
      data[p + 2] = (9 + 26 * s) * lash;
      data[p + 3] = 255;
    }
  }
}

// closure curve: ease-in slam, micro-hold shut, ballistic release
function blinkClosure(q) {
  if (q < 0.44) { const k = q / 0.44; return k * k * (3 - 2 * k); }
  if (q < 0.54) return 1;
  const k = (q - 0.54) / 0.46;
  return Math.pow(1 - k, 1.55);
}

function renderMedia(t, data) {
  // find segment
  let idx = 0;
  for (let k = 0; k < SEGS.length; k++) {
    if (t >= SEGS[k].t0 && t < SEGS[k].t1) { idx = k; break; }
    if (t >= SEGS[k].t1) idx = k;
  }
  const seg = SEGS[idx];
  const u = t - seg.t0;
  const endA = t >= MEDIA_END ? smooth(MEDIA_END, MEDIA_END + 0.45, t) : 0;

  // realistic blink straddling the boundary: lids close over prev, open onto next
  let showSeg = seg, su = u, lidEdge = 0;
  if (idx > 0 && u < BLINK) {
    const q = u / BLINK;
    lidEdge = blinkClosure(q);
    if (q < 0.49) {
      showSeg = SEGS[idx - 1];
      su = showSeg.dur - 1e-3 + u;      // prev keeps playing as lids shut
    } else {
      su = u;                           // new frame already under the lids
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let [R, G, B] = segColor(showSeg, su, c, r);
      if (endA > 0) { R *= 1 - endA; G *= 1 - endA; B *= 1 - endA; }
      const cell = blobFromRGB(R, G, B);
      if (!cell) continue;
      drawCellBits(data, c, r, cell[0], cell[1], cell[2], cell[3]);
    }
  }

  // golden dust motes (balanced montage life) — drawn before the strip so the
  // caption zone stays clean
  drawDust(t, data);

  const side = t < MEDIA_END ? mediaSideAt(t) : null;
  let on = 1;
  if (side) {
    // strip slides in over the first 0.38s of each segment; the previous
    // strip slides out the same way when the side changes
    on = smooth(0, 0.38, u);
    const prev = idx > 0 ? SEGS[idx - 1].ls : null;
    if (on < 1 && prev && prev !== side) drawStrip(prev, data, 1 - on);
    drawStrip(side, data, on);
  }

  drawFireworks(t, data);
  drawConfetti(t, data);
  drawFlash(t, data);
  drawLyrics(t, data, side, on);
  drawLid(lidEdge, data);

  if (endA > 0.01) drawEndCard(data, t, endA);
}

function drawEndCard(data, t, a) {
  const tc = t - MEDIA_END;
  const fade = smooth(0.3, 0.9, tc);
  const A = a * fade;
  // headline: "make a wish"
  drawMaskText(data, M.wish, W / 2, 118, (f) => {
    const v = A * (0.92 + 0.08 * Math.sin(t * 3 + f * 4));
    return [255 * v, 214 * v, 226 * v];
  });
  // cake origin (centered)
  const C0 = 67, R0 = 19;
  const CAKE = [
    "      i  i  i  i  i",
    "      |  |  |  |  |",
    "   .-=-=-=-=-=-=-=-.",
    "   |  o  o  o  o   |",
    "   |  .  .  .  .   |",
    "   '-=-=-=-=-=-=-=-'",
    "  .-=-=-=-=-=-=-=-=-=-.",
    "  |  o  o  o  o  o    |",
    "  |  .  .  .  .  .    |",
    "  '-=-=-=-=-=-=-=-=-=-'",
    "  |                   |",
    "  '-------------------'"
  ];
  const CAKE_COLS = [C0 + 6, C0 + 9, C0 + 12, C0 + 15, C0 + 18];
  // cake body
  for (let rr = 0; rr < CAKE.length; rr++) {
    const row = CAKE[rr];
    for (let cc = 0; cc < row.length; cc++) {
      const ch = row[cc];
      if (ch === " ") continue;
      const bits = ATLAS[ch === "i" ? "i" : ch === "o" ? "o" : ch === "|" ? "|" : ch === "-" ? "-" : ch === "=" ? "-" : ch === "'" ? "'" : ch === "." ? "." : "#"];
      if (!bits) continue;
      const col = ch === "o" ? [255, 170, 200] : ch === "." ? [255, 220, 140] : [230, 150, 180];
      drawCellBits(data, C0 + cc, R0 + rr, col[0] * A, col[1] * A, col[2] * A, bits);
    }
  }
  // candles + flames + smoke
  for (let k = 0; k < CAKE_COLS.length; k++) {
    const cx = CAKE_COLS[k];
    const blowT = 2.1 + k * 0.15;
    const blown = tc >= blowT;
    // flame (flicker) before blow-out
    if (!blown && tc >= 0.9) {
      const fl = 0.6 + 0.4 * Math.sin(t * 12 + k * 2.1);
      const bits = ATLAS["*"];
      if (bits) {
        drawCellBits(data, cx, R0 - 1, 255 * A * fl, 200 * A * fl, 90 * A * fl, bits);
        drawCellBits(data, cx, R0 - 2, 255 * A * fl * 0.7, 160 * A * fl * 0.7, 60 * A * fl * 0.7, bits);
      }
    }
    // smoke wisps after blow-out
    if (blown) {
      const age = tc - blowT;
      if (age < 0.9) {
        const fadeS = (1 - age / 0.9);
        for (let s = 0; s < 4; s++) {
          const sy = R0 - 2 - (age * 6 + s) | 0;
          const sx = cx + Math.round(Math.sin(age * 4 + s * 1.7 + k) * (1 + s * 0.4));
          if (sy < 0 || sy >= ROWS || sx < 0 || sx >= COLS) continue;
          const bits = ATLAS[s % 2 === 0 ? "·" : ":"];
          if (bits) drawCellBits(data, sx, sy, 150 * A * fadeS, 140 * A * fadeS, 150 * A * fadeS, bits);
        }
      }
    }
  }
  // heart (kept, small) bottom-left of bye
  const hb = 9;
  const v = A * (0.82 + 0.18 * Math.sin(t * 4));
  for (let r = 0; r < HEART_BITS.length; r++) {
    for (let c = 0; c < hb; c++) {
      if (HEART_BITS[r][c] !== "X") continue;
      const bits = ATLAS["#"];
      if (bits) drawCellBits(data, 75 + c, 50 + r, 255 * v, 74 * v, 108 * v, bits);
    }
  }
  // bye line
  drawMaskText(data, M.bye, W / 2, 592, () => {
    const v2 = A * (0.5 + 0.1 * Math.sin(t * 2));
    return [200 * v2, 180 * v2, 190 * v2];
  });
  // confetti rain (gentle) across the whole card
  drawConfettiFall(data, t, 22, 7001, [[255, 160, 200], [255, 210, 140], [255, 235, 245], [255, 180, 120]], 1.6, 0.4, tc >= 0);
  // burst at blow-out complete
  if (tc >= 2.7) {
    const age = tc - 2.7;
    if (age < 1.2) {
      const fadeB = Math.pow(1 - age / 1.2, 1.3);
      const rngB = mulberry32(9091);
      for (let k = 0; k < 36; k++) {
        const ang = rngB() * Math.PI * 2;
        const sp = 0.35 + rngB() * 0.65;
        const x = 80 + Math.cos(ang) * sp * age * 520;
        const y = 30 + Math.sin(ang) * sp * age * 520 + age * age * 120;
        const cc = (x / CELL_W) | 0, rr2 = (y / CELL_H) | 0;
        if (cc < 0 || cc >= COLS || rr2 < 0 || rr2 >= ROWS) continue;
        const col = [[255, 160, 200], [255, 210, 140], [255, 235, 245]][k % 3];
        const bits = ATLAS[rngB() < 0.5 ? "*" : "·"];
        if (bits) drawCellBits(data, cc, rr2, col[0] * fadeB, col[1] * fadeB, col[2] * fadeB, bits);
      }
    }
  }
  // sparkles at cake corners
  for (let k = 0; k < 6; k++) {
    const fl = 0.5 + 0.5 * Math.sin(t * 4 + k * 1.9);
    if (fl < 0.35) continue;
    const sx = C0 - 2 + (k % 2) * 26;
    const sy = R0 - 3 + (k % 3);
    const bits = ATLAS["*"];
    if (bits) drawCellBits(data, sx, sy, 255 * A * fl, 220 * A * fl, 160 * A * fl, bits);
  }
}

// ── synchronized lyric captions: fade + active-word highlight ──
const LYR_TOP = 592;
const STRIP_F = 0.3;
function stripRect(side, on) {
  const sw = Math.round(W * STRIP_F), sh = Math.round(H * STRIP_F);
  on = on === undefined ? 1 : on;
  // animated: 'l' slides in from the left, 'r' from the right, 't' from the
  // top, 'b' from the bottom (on = 0 → fully offscreen, on = 1 → resting)
  if (side === "l") return [-sw * (1 - on), 0, sw, H];
  if (side === "r") return [W - sw * on, 0, sw, H];
  if (side === "t") return [0, -sh * (1 - on), W, sh];
  if (side === "b") return [0, H - sh * on, W, sh];
  return null;
}
function mediaSideAt(t) {
  for (let k = 0; k < SEGS.length; k++) {
    if (t >= SEGS[k].t0 && t < SEGS[k].t1) return SEGS[k].ls;
  }
  return null;
}
function drawStrip(side, data, on) {
  const r = stripRect(side, on);
  if (!r) return;
  let [x, y, w, h] = r;
  x = Math.round(x); y = Math.round(y);
  const x0 = Math.max(0, x), x1 = Math.min(W, x + w);
  const y0 = Math.max(0, y), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) {
    let p = (yy * W + x0) * 4;
    for (let xx = x0; xx < x1; xx++) {
      data[p] = 7; data[p + 1] = 5; data[p + 2] = 8; data[p + 3] = 255;
      p += 4;
    }
  }
  // subtle 2px inner edge so the buffer reads as a designed zone —
  // it rides the leading edge while the strip slides
  const acc = side === "l" || side === "r";
  const ax = side === "r" ? x : side === "l" ? x + w - 2 : x;
  const ay = side === "b" ? y : side === "t" ? y + h - 2 : y;
  const aw = acc ? 2 : w, ah = acc ? h : 2;
  const bx0 = Math.max(0, ax), bx1 = Math.min(W, ax + aw);
  const by0 = Math.max(0, ay), by1 = Math.min(H, ay + ah);
  for (let yy = by0; yy < by1; yy++) {
    let p = (yy * W + bx0) * 4;
    for (let xx = bx0; xx < bx1; xx++) {
      data[p] = 44; data[p + 1] = 24; data[p + 2] = 30; data[p + 3] = 255;
      p += 4;
    }
  }
}
function paintCaption(data, m, cx, top, a, t, wt, wx) {
  const OL = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let o = 0; o < 4; o++) {
    drawMaskText(data, m, cx + OL[o][0], top + OL[o][1], () => {
      return [11 * a, 6 * a, 8 * a];
    });
  }
  drawMaskText(data, m, cx + 2, top + 2, () => {
    const v = a * 0.6;
    return [16 * v, 9 * v, 12 * v];
  });
  drawMaskText(data, m, cx, top, (fx) => {
    const x = fx * m.w;
    let act = false;
    for (let k = 0; k < wt.length; k++) {
      if (t >= wt[k][0] && t <= wt[k][1] + 0.12 &&
          x >= wx[k][0] && x <= wx[k][1]) { act = true; break; }
    }
    const v = a * (act ? 1.25 : 0.8) * (0.97 + 0.03 * Math.sin(t * 5 + fx * 8));
    return act ? [255 * v, 234 * v, 243 * v] : [236 * v, 214 * v, 226 * v];
  });
  // sung-word sparkle: a twinkle above each currently highlighted word
  for (let k = 0; k < wt.length; k++) {
    if (!(t >= wt[k][0] && t <= wt[k][1] + 0.12)) continue;
    const x0 = cx - m.w / 2 + wx[k][0];
    const x1 = cx - m.w / 2 + wx[k][1];
    const xw = (x0 + x1) / 2;
    const tw = 0.5 + 0.5 * Math.sin(t * 7.3 + k * 1.9);
    if (tw < 0.35) continue;
    const bits = ATLAS["*"];
    if (!bits) continue;
    const cc = Math.round(xw / CELL_W);
    const rr2 = Math.round((top - 14) / CELL_H);
    drawCellBits(data, cc, rr2, 255 * a * tw, 225 * a * tw, 170 * a * tw, bits);
    if (wx[k][1] - wx[k][0] > 24) {
      const bits2 = ATLAS["·"];
      if (bits2) drawCellBits(data, cc + 1, rr2 - 1, 220 * a * tw, 195 * a * tw, 150 * a * tw, bits2);
    }
  }
}
// ── golden dust motes over the photo zone (balanced montage life) ──
const DUST = [];
for (let k = 0; k < 14; k++) {
  const r = mulberry32(2027 + k * 97);
  DUST.push({ bx: r() * W, spd: 0.35 + r() * 0.5, phase: r() * Math.PI * 2, sway: 0.5 + r() * 0.7 });
}
function drawDust(t, data) {
  for (let k = 0; k < DUST.length; k++) {
    const d = DUST[k];
    const y = (d.phase * 40 + t * 22 * d.spd) % (H + 30) - 15;
    const x = d.bx + Math.sin(t * 0.7 * d.sway + d.phase) * 14;
    const cc = (x / CELL_W) | 0, rr2 = (y / CELL_H) | 0;
    if (cc < 0 || cc >= COLS || rr2 < 0 || rr2 >= ROWS) continue;
    const tw = 0.22 + 0.18 * Math.sin(t * 1.6 + d.phase);
    const bits = ATLAS[k % 2 === 0 ? "·" : "."];
    if (bits) drawCellBits(data, cc, rr2, 230 * tw, 205 * tw, 175 * tw, bits);
  }
}

// ── line-change confetti puff (deterministic, seek-safe) ──
function drawLinePuff(data, L, side, cx, top, age, a) {
  const fade = Math.pow(1 - age / 0.7, 1.4);
  const rng = mulberry32(((L.t0 * 1000) | 0) + 555);
  const py0 = top - 6;
  for (let k = 0; k < 8; k++) {
    const ang = -Math.PI / 2 + (rng() - 0.5) * (Math.PI * 0.9);
    const sp = 0.3 + rng() * 0.7;
    const x = cx + Math.cos(ang) * sp * age * 260;
    const y = py0 + Math.sin(ang) * sp * age * 260 + age * age * 60;
    const cc = (x / CELL_W) | 0, rr2 = (y / CELL_H) | 0;
    if (cc < 0 || cc >= COLS || rr2 < 0 || rr2 >= ROWS) continue;
    const col = [[255, 170, 205], [255, 210, 140], [255, 235, 245], [240, 200, 255]][k % 4];
    const bits = ATLAS[rng() < 0.5 ? "*" : "·"];
    if (bits) drawCellBits(data, cc, rr2, col[0] * fade * a, col[1] * fade * a, col[2] * fade * a, bits);
  }
}

function drawLyrics(t, data, side, on) {
  if (!LYRICS.length || t < 13.0 || t > 87.7) return;
  // pick the candidate line with the highest fade weight — during overlaps the
  // incoming line must not win while still at a=0 (that blanked the captions)
  let best = null, a = 0;
  for (const L of LYRICS) {
    if (t < L.t0 - 0.06 || t > L.t1 + 0.2) continue;
    const la = Math.min(
      smooth(L.t0, L.t0 + 0.22, t),
      1 - smooth(L.t1 - 0.28, L.t1, t)
    );
    if (la > a) { a = la; best = L; }
  }
  if (!best || a < 0.05) return;
  if (side) {
    const r = stripRect(side, on);
    const cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2;
    const rise = (1 - a) * 7;
    if ((side === "l" || side === "r") && best.subs.length > 1) {
      const gap = 9;
      let bh = 0;
      for (const s of best.subs) bh += s.h;
      bh += gap * (best.subs.length - 1);
      let top = Math.round(cy - bh / 2) + rise;
      for (const s of best.subs) {
        paintCaption(data, s, cx, top, a, t, s.wt, s.wx);
        top += s.h + gap;
      }
    } else {
      paintCaption(data, best, cx, Math.round(cy - best.h / 2) + rise, a, t,
                   best.wt, best.wx);
    }
    // line-change confetti puff (deterministic, seek-safe)
    const puffAge = t - best.t0;
    if (puffAge >= 0 && puffAge < 0.7) {
      drawLinePuff(data, best, side, cx, Math.round(cy - (best.subs.length > 1 ? 0 : best.h / 2)) + rise, puffAge, a);
    }
    return;
  }
  const rise = (1 - a) * 7;
  paintCaption(data, best, W / 2, LYR_TOP + rise, a, t, best.wt, best.wx);
  const puffAge = t - best.t0;
  if (puffAge >= 0 && puffAge < 0.7) {
    drawLinePuff(data, best, null, W / 2, LYR_TOP + rise, puffAge, a);
  }
}

// ── real-font mask text: packed 1-bit bbox, per-x animated color ──
function drawMaskText(data, m, cx, top, colorFn) {
  if (!m) return;
  const x0 = Math.round(cx - m.w / 2), y0 = Math.round(top);
  const bpr = (m.w + 7) >> 3;
  const d = m.d;
  for (let y = 0; y < m.h; y++) {
    const py = y0 + y;
    if (py < 0 || py >= H) continue;
    const rowB = y * bpr;
    for (let x = 0; x < m.w; x++) {
      if ((d.charCodeAt(rowB + (x >> 3)) & (128 >> (x & 7))) === 0) continue;
      const px = x0 + x;
      if (px < 0 || px >= W) continue;
      const [R, G, B] = colorFn(x / m.w, y / m.h);
      const p = (py * W + px) * 4;
      data[p] = R < 0 ? 0 : R > 255 ? 255 : R | 0;
      data[p + 1] = G < 0 ? 0 : G > 255 ? 255 : G | 0;
      data[p + 2] = B < 0 ? 0 : B > 255 ? 255 : B | 0;
      data[p + 3] = 255;
    }
  }
}

// ── intro balloons bitmaps ──
const BALLOON_BITS = [
  ".XXX.",
  "XXXXX",
  "XXXXX",
  ".XXX.",
  "..X.."
];
function drawBalloonMini(data, c0, r0, R, G, B) {
  const bits = ATLAS["#"];
  if (!bits) return;
  for (let y = 0; y < BALLOON_BITS.length; y++) {
    for (let x = 0; x < 5; x++) {
      if (BALLOON_BITS[y][x] !== "X") continue;
      drawCellBits(data, c0 + x, r0 + y, R, G, B, bits);
    }
  }
  // string (3 cells down, slight sway)
  const sBits = ATLAS["|"];
  if (sBits) for (let s = 0; s < 3; s++)
    drawCellBits(data, c0 + 2, r0 + 5 + s, R * 0.7, G * 0.7, B * 0.7, sBits);
}

// ── generic confetti fall (seeded, deterministic, seek-safe) ──
function drawConfettiFall(data, t, count, seed, colors, vy, vx, gate) {
  if (gate === false) return;
  const rng = mulberry32(seed);
  for (let k = 0; k < count; k++) {
    const baseX = rng() * W;
    const baseY = rng() * H;
    const spd = 0.6 + rng() * 1.1;
    const sway = 0.4 + rng() * 0.9;
    const phase = rng() * Math.PI * 2;
    const col = colors[(rng() * colors.length) | 0];
    const glyph = rng() < 0.5 ? "*" : "·";
    const bits = ATLAS[glyph];
    if (!bits) continue;
    const y = (baseY + t * (vy || 1.4) * spd) % (H + 20) - 10;
    const x = (baseX + Math.sin(t * (vx || 0.6) * sway + phase) * 18) % W;
    const cc = (x / CELL_W) | 0, rr2 = (y / CELL_H) | 0;
    if (cc < 0 || cc >= COLS || rr2 < 0 || rr2 >= ROWS) continue;
    const tw = 0.55 + 0.45 * Math.sin(t * 2.1 + phase);
    drawCellBits(data, cc, rr2, col[0] * tw, col[1] * tw, col[2] * tw, bits);
  }
}
const HEART_BITS = [
  "..XX.XX..",
  ".XXXXXXX.",
  "XXXXXXXXX",
  "XXXXXXXXX",
  ".XXXXXXX.",
  "..XXXXX..",
  "...XXX...",
  "....X...."
];
function drawHeartMini(data, c0, r0, R, G, B) {
  const bits = ATLAS["#"];
  if (!bits) return;
  for (let y = 0; y < HEART_BITS.length; y++) {
    for (let x = 0; x < 9; x++) {
      if (HEART_BITS[y][x] !== "X") continue;
      drawCellBits(data, c0 + x, r0 + y, R, G, B, bits);
    }
  }
}

// ══ INTRO v2 ══
function renderIntro(t, data) {
  data.fill(0);
  const pulse = 0.75 + 0.25 * Math.sin(t * 2.2);
  const slow = 0.5 + 0.5 * Math.sin(t * 0.9);

  // faint starfield
  const rngStar = mulberry32(31337);
  for (let k = 0; k < 48; k++) {
    const sx = 2 + (rngStar() * 156) | 0;
    const sy = 2 + (rngStar() * 41) | 0;
    const fl = 0.28 + 0.28 * Math.sin(t * 1.9 + k * 2.3);
    if (fl < 0.12) continue;
    const bits = ATLAS[rngStar() < 0.5 ? "·" : "."];
    if (bits) drawCellBits(data, sx, sy, 205 * fl, 195 * fl, 178 * fl, bits);
  }

  // decorative border
  const bR = 150 + 40 * slow, bG = 105 + 25 * slow, bB = 120;
  for (let c = 2; c < COLS - 2; c += 2) {
    const bits = ATLAS[c % 8 === 0 ? "+" : "·"];
    if (bits) {
      drawCellBits(data, c, 1, bR * 0.75, bG * 0.75, bB * 0.75, bits);
      drawCellBits(data, c, ROWS - 2, bR * 0.75, bG * 0.75, bB * 0.75, bits);
    }
  }
  for (let r = 2; r < ROWS - 2; r += 2) {
    const bits = ATLAS[r % 8 === 0 ? "+" : ":"];
    if (bits) {
      drawCellBits(data, 1, r, bR * 0.6, bG * 0.6, bB * 0.6, bits);
      drawCellBits(data, COLS - 2, r, bR * 0.6, bG * 0.6, bB * 0.6, bits);
    }
  }
  for (const [cc, rr] of [[1, 1], [COLS - 2, 1], [1, ROWS - 2], [COLS - 2, ROWS - 2]]) {
    const bits = ATLAS["#"];
    if (bits) drawCellBits(data, cc, rr, 215 * pulse, 160, 170, bits);
  }

  // birthday confetti — soft pastel drift behind the copy
  drawConfettiFall(data, t, 28, 4242, [[255, 170, 205], [255, 215, 150], [255, 235, 245], [240, 200, 255]], 1.1, 0.5, true);

  // floating balloons — side lanes, rising
  for (let k = 0; k < 3; k++) {
    const seed = (k * 0.47 + 0.21) % 1;
    const laneL = k % 2 === 0;
    const hx = (laneL ? 8 + seed * 22 : 132 + seed * 20) + Math.sin(t * 0.6 + k * 1.7) * 2;
    const hy = ROWS + 8 - ((t * (0.9 + seed * 0.5) + seed * 28) % (ROWS + 14));
    const v = 0.6 + 0.25 * Math.sin(t * 2.2 + k);
    if (v < 0.3) continue;
    const col = k % 2 === 0 ? [255, 150, 190] : [255, 205, 120];
    drawBalloonMini(data, hx | 0, hy | 0, col[0] * v, col[1] * v, col[2] * v);
  }

  // sparkles
  const rngSp = mulberry32(55);
  for (let k = 0; k < 12; k++) {
    const sx = 6 + (rngSp() * 148) | 0;
    const sy = 3 + (rngSp() * 39) | 0;
    const fl = 0.5 + 0.5 * Math.sin(t * 3.2 + k * 1.7);
    if (fl < 0.4) continue;
    const bits = ATLAS[["*", "+", "·"][k % 3]];
    if (bits) drawCellBits(data, sx, sy, 255 * fl * 0.95, 235 * fl, 205 * fl * 0.85, bits);
  }

  // HEADLINE — real script font, per-x pink→gold gradient: "hey beautiful"
  drawMaskText(data, M.hey, W / 2, 46, (f) => {
    const v = 0.97 + 0.03 * Math.sin(t * 1.5 + f * 2);
    return [
      255 * v,
      (150 + 105 * f) * (0.92 + 0.08 * Math.sin(t * 2.0 + f * 3)),
      (145 - 75 * f + 15 * Math.sin(t * 1.7 + f * 2)) * 0.96
    ];
  });

  // subline
  drawMaskText(data, M.sub, W / 2, 234, (f) => {
    const v = 0.92 + 0.08 * Math.sin(t * 1.8 + f * 4);
    return [245 * v, 226 * v, 236 * v];
  });

  // play button — dot ring with rotating highlight + bold triangle
  const pcx = 80, pcy = 24, rx = 13, ry = 8;
  const rot = t * 1.3;
  for (let k = 0; k < 36; k++) {
    const a = (k / 36) * Math.PI * 2;
    const cc = Math.round(pcx + rx * Math.cos(a));
    const rr2 = Math.round(pcy + ry * Math.sin(a));
    let da = (a - rot) % (Math.PI * 2);
    if (da > Math.PI) da -= Math.PI * 2;
    if (da < -Math.PI) da += Math.PI * 2;
    const hl = Math.exp(-Math.pow(da / 0.7, 2));
    const v = (0.72 + 0.28 * hl) * (0.92 + 0.08 * pulse);
    const bits = ATLAS[hl > 0.55 ? "@" : hl > 0.2 ? "*" : "·"];
    if (bits) drawCellBits(data, cc, rr2, 255 * v, 218 * v, 95 * v, bits);
  }
  // triangle (11 rows, centered on ring)
  const triRows = [1, 2, 4, 6, 8, 10, 8, 6, 4, 2, 1];
  const offR = pcy - 5, offC = pcx - 4;
  const tv = 0.86 + 0.14 * pulse;
  for (let r = 0; r < triRows.length; r++) {
    for (let c = 0; c < triRows[r]; c++) {
      const bits = ATLAS["#"];
      if (bits) drawCellBits(data, offC + c, offR + r, 255 * tv, 216 * tv, 88 * tv, bits);
    }
  }

  // CTA
  drawMaskText(data, M.cta, W / 2, 556, (f) => {
    const v = 0.86 + 0.14 * Math.sin(t * 2.4 + f * 2);
    return [248 * v, 222 * v, 185 * v];
  });
  drawMaskText(data, M.snd, W / 2, 614, (f) => {
    const v = 0.55 + 0.12 * Math.sin(t * 1.6 + f * 3);
    return [195 * v, 175 * v, 185 * v];
  });

  // floating textured hearts — side lanes only (never over the copy)
  for (let k = 0; k < 5; k++) {
    const seed = (k * 0.618 + 0.13) % 1;
    const laneL = k % 2 === 0;
    const hx = (laneL ? 5 + seed * 30 : 126 + seed * 26) + Math.sin(t * 0.7 + k * 2.1) * 3;
    const hy = ROWS + 5 - ((t * (1.1 + seed * 0.7) + seed * 34) % (ROWS + 10));
    const v = 0.5 + 0.28 * Math.sin(t * 2.5 + k);
    if (v < 0.24) continue;
    drawHeartMini(data, hx | 0, hy | 0, 255 * v, 95 * v, 125 * v);
  }
}
// ENGINE_END

if (typeof document !== "undefined") {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(W, H);
  const data = img.data;

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
  }
  addEventListener("resize", fit);
  fit();

  let mode = "intro";
  let tF = 0, clock = null;

  const bgm = document.getElementById("bgm");
  const BGM_START = 20;
  let playing = false, playTries = 0;
  function tryPlay() {
    if (!bgm || playing || playTries > 12) return;
    playTries++;
    let p;
    try { p = bgm.play(); } catch (e) { setTimeout(tryPlay, 350); return; }
    if (!p || !p.then) { playing = true; return; }
    p.then(() => {
      playing = true;
      if (bgm.muted) bgm.muted = false;
    }).catch((err) => {
      if (err && err.name === "NotAllowedError") {
        bgm.muted = true;
        let p2;
        try { p2 = bgm.play(); } catch (e) { return; }
        if (p2 && p2.then) p2.then(() => { playing = true; }).catch(() => {});
        else playing = true;
      } else {
        setTimeout(tryPlay, 350);
      }
    });
  }
  function seekTo(pos) {
    if (!bgm) return;
    try {
      if (bgm.readyState >= 1) {
        const s = bgm.seekable;
        if (!s || !s.length || s.end(s.length - 1) >= pos) bgm.currentTime = pos;
      }
    } catch (e) {}
  }
  function seekStart() { seekTo(BGM_START); }
  function onGesture() {
    if (!bgm) return;
    if (bgm.muted) bgm.muted = false;
    if (bgm.paused) tryPlay();
  }
  if (bgm) {
    bgm.addEventListener("loadedmetadata", () => { seekStart(); });
    seekStart();
    addEventListener("pointerdown", onGesture);
    addEventListener("keydown", onGesture);
  }

  function startFilm() {
    mode = "film";
    tF = 0;
    clock = null;
    canvas.style.cursor = "none";
    seekStart();
    if (bgm) { bgm.muted = false; tryPlay(); playTries = 0; }
  }

  canvas.addEventListener("click", (e) => {
    e.stopPropagation();
    if (mode === "intro") { startFilm(); return; }
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const fn = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
      if (fn) { const p = fn.call(canvas); if (p && p.catch) p.catch(() => {}); }
    }
  });
  addEventListener("keydown", (e) => {
    if (mode === "intro" && (e.key === " " || e.key === "Enter")) {
      e.preventDefault();
      startFilm();
    }
  });

  function loop(now) {
    if (mode === "film") {
      if (clock === null) clock = now;
      tF += Math.min(0.1, (now - clock) / 1000);
      clock = now;
      if (tF >= FILM_LEN) {
        mode = "intro";
        tF = 0;
        clock = null;
        canvas.style.cursor = "pointer";
        playTries = 0;
        if (bgm) seekStart();
      } else if (bgm && bgm.readyState >= 1) {
        // keep the music locked to the film: the mp3 position must always be
        // tF + BGM_START (recovers from failed seeks, intro drift, tab stalls)
        const want = tF + BGM_START;
        if (Math.abs(bgm.currentTime - want) > 0.5) seekTo(want);
      }
    }
    if (mode === "film") renderFrame(tF, Math.floor(tF * FPS), data);
    else renderIntro(now / 1000, data);
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

</script>
